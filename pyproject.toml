[project]
name = "runsite-sdk"
version = "0.1.0"
description = "Official Python SDK for Runsite: email, storage and secrets for your apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "runsite-platform", email = "info@runsite.app" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
]
keywords = ["runsite", "paas", "email", "secrets", "s3", "object-storage", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
storage = ["boto3>=1.36,<2"]

[project.urls]
Homepage = "https://runsite.app"
Documentation = "https://docs.runsite.app"
Repository = "https://github.com/runsite-platform/runsite-python"
Issues = "https://github.com/runsite-platform/runsite-python/issues"

[build-system]
requires = ["uv_build>=0.8.22,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "runsite"

[dependency-groups]
dev = [
    "boto3>=1.36,<2",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6",
    "respx>=0.22",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: calls live Runsite services; needs RUNSITE_API_KEY and RUNSITE_BASE_URL"]

[tool.coverage.run]
source = ["runsite"]
branch = true

[tool.coverage.report]
exclude_also = ["raise AssertionError"]
